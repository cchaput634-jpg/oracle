<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cristallomancie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Pinyon+Script&family=La+Belle+Aurore&family=Noto+Sans+Runic&display=swap">
<style>
/* Layout : un livre posé sur un bureau sombre à la bougie ; double page sur grand écran, page seule sur téléphone. */
:root{
  --desk:#1a110b; --desk-glow:#4a2c15;
  --leather:#3b1d14; --leather-dark:#24100a; --gold:#c9a25a; --gold-soft:#8f6d35;
  --parch:#e8d3a6; --parch-dark:#c9a86f;
  --ink:#2e1a0e; --ink-red:#6a1f12; --ink-soft:#6b4a2c;
  --f-script:"Pinyon Script","Apple Chancery",cursive;
  --f-head:"IM Fell English SC","IM Fell English",Garamond,serif;
  --f-body:"IM Fell English",Garamond,"Times New Roman",serif;
  --f-hand:"La Belle Aurore","Bradley Hand","Segoe Script",cursive;
  --f-rune:"Noto Sans Runic","Segoe UI Historic","Segoe UI Symbol",sans-serif;
  --pw:340px; --ph:486px;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--parch);font-family:var(--f-body);overflow:hidden;
  background:radial-gradient(ellipse at 50% 40%, var(--desk-glow) 0%, var(--desk) 62%);}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.stage{position:relative;perspective:2600px;overflow:visible}
.stage.single{overflow:hidden;border-radius:2px}
.book{position:relative;width:calc(var(--pw)*2);height:var(--ph);transition:transform .9s cubic-bezier(.45,.05,.25,1);transform-style:preserve-3d}
.leaf{position:absolute;top:0;left:50%;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;
  transition:transform .9s cubic-bezier(.45,.05,.25,1);cursor:pointer}
.leaf.flipped{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.back{transform:rotateY(180deg)}

/* Parchemin */
.paper{background:
   radial-gradient(ellipse at 25% 20%, rgba(255,244,210,.6), transparent 55%),
   radial-gradient(ellipse at 80% 90%, rgba(120,72,25,.28), transparent 55%),
   radial-gradient(ellipse at 10% 80%, rgba(140,85,30,.18), transparent 45%),
   var(--parch);
  color:var(--ink);box-shadow:inset 0 0 calc(var(--pw)*.09) rgba(95,52,15,.55)}
.paper::before{content:"";position:absolute;inset:0;opacity:.32;mix-blend-mode:multiply;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .3 0 0 0 0 .15 0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.paper::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.45;mix-blend-mode:multiply;background-size:cover;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='500' height='700'><filter id='m'><feTurbulence type='fractalNoise' baseFrequency='.014' numOctaves='4' seed='3'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .32 0 0 0 0 .12 0 0 0 1.4 -.6'/></filter><rect width='100%' height='100%' filter='url(%23m)'/></svg>")}
.front.paper{background-color:var(--parch)}
.front.paper .gutter{position:absolute;inset:0 auto 0 0;width:12%;background:linear-gradient(90deg,rgba(70,35,10,.35),transparent);pointer-events:none;z-index:3}
.back.paper .gutter{position:absolute;inset:0 0 0 auto;width:12%;background:linear-gradient(270deg,rgba(70,35,10,.35),transparent);pointer-events:none;z-index:3}

.pg{position:relative;z-index:2;height:100%;box-sizing:border-box;padding:calc(var(--pw)*.1) calc(var(--pw)*.1) calc(var(--pw)*.08);
  display:flex;flex-direction:column;gap:calc(var(--pw)*.03);font-size:calc(var(--pw)*.043);line-height:1.38}
.front .pg{padding-left:calc(var(--pw)*.13)}
.back .pg{padding-right:calc(var(--pw)*.13)}
h2{font-family:var(--f-head);font-weight:normal;color:var(--ink-red);font-size:1.5em;margin:0;text-align:center;text-wrap:balance;line-height:1.1}
.rule{display:flex;align-items:center;gap:.5em;color:var(--ink-soft);font-family:var(--f-rune);font-size:.8em;justify-content:center}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--ink-soft),transparent)}
p{margin:0;font-family:var(--f-hand);font-size:1em;line-height:1.5}
.lettrine::first-letter{font-family:var(--f-hand);color:var(--ink-red);float:left;font-size:2.6em;line-height:1;margin:-.05em .18em 0 0}
.rn{font-family:var(--f-rune);font-style:normal;color:var(--ink);font-size:1.05em}
.sig{font-family:var(--f-hand);font-size:1.7em;color:var(--ink);text-align:right;margin-top:auto;line-height:1}
.folio{position:absolute;bottom:calc(var(--pw)*.04);left:0;right:0;text-align:center;font-family:var(--f-head);font-size:calc(var(--pw)*.034);color:var(--ink-soft);z-index:2;letter-spacing:.08em}
.note{font-size:.92em;color:var(--ink-soft);border-left:1px solid var(--ink-soft);padding-left:.6em}
ul,ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:.35em;font-family:var(--f-hand);font-size:1em;line-height:1.45}
ol li::marker{font-family:var(--f-script);font-style:normal;color:var(--ink-red);font-size:1.25em}
ul li::marker{content:"᛫  ";font-family:var(--f-rune);color:var(--ink-red)}

/* Table des runes */
.runes{display:flex;flex-direction:column;gap:0;margin-top:.2em}
.row{display:grid;grid-template-columns:2.6em 2.2em 1fr;align-items:center;gap:.4em;padding:.18em 0;border-bottom:1px dashed rgba(107,74,44,.35)}
.row .r{font-family:var(--f-rune);font-size:1.7em;line-height:1;text-align:center;color:var(--ink);text-shadow:0 0 .5px var(--ink)}
.row .l{font-family:var(--f-hand);font-size:1.6em;line-height:1;color:var(--ink-red);text-align:center}
.row .n{font-family:var(--f-hand);color:var(--ink-soft);font-size:1.05em}

.pair{display:grid;grid-template-columns:auto 1fr;gap:.2em .7em;align-items:center}
.pair .gl{font-family:var(--f-rune);font-size:1.45em;white-space:nowrap;color:var(--ink)}
.pair p{font-size:.92em;line-height:1.4}

/* Couverture */
.cover{background:
  radial-gradient(ellipse at 30% 25%, rgba(255,200,140,.12), transparent 50%),
  linear-gradient(135deg,var(--leather),var(--leather-dark));color:var(--gold);
  box-shadow:inset 0 0 calc(var(--pw)*.12) rgba(0,0,0,.7)}
.cover::before{content:"";position:absolute;inset:0;opacity:.35;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='l'><feTurbulence type='fractalNoise' baseFrequency='.6' numOctaves='4'/><feColorMatrix values='0 0 0 0 .3 0 0 0 0 .2 0 0 0 0 .1 0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23l)'/></svg>")}
.cv{position:absolute;inset:calc(var(--pw)*.06);border:2px solid var(--gold-soft);outline:1px solid var(--gold-soft);outline-offset:calc(var(--pw)*-.025);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--pw)*.045);text-align:center;padding:calc(var(--pw)*.08)}
.cv .band{font-family:var(--f-rune);font-size:calc(var(--pw)*.045);letter-spacing:.35em;color:var(--gold-soft)}
.cv h1{margin:0;font-family:var(--f-script);font-weight:normal;font-size:calc(var(--pw)*.15);line-height:.95;color:var(--gold);text-shadow:0 1px 0 #000,0 0 8px rgba(201,162,90,.35);text-wrap:balance}
.cv .by{font-family:var(--f-head);font-size:calc(var(--pw)*.05);letter-spacing:.12em;color:var(--gold)}
.cv svg{width:calc(var(--pw)*.32);height:auto}
.spine-l{position:absolute;inset:0 auto 0 0;width:7%;background:linear-gradient(90deg,rgba(0,0,0,.55),transparent)}
.spine-r{position:absolute;inset:0 0 0 auto;width:7%;background:linear-gradient(270deg,rgba(0,0,0,.55),transparent)}

/* Gardes */
.endpaper{background:
  repeating-radial-gradient(circle at 30% 40%, #4a1a14 0 6px, #3a130e 6px 13px, #55241a 13px 17px),
  #3a130e}
.endpaper::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse,transparent 30%,rgba(0,0,0,.55))}
.exlib{position:absolute;inset:18% 14%;z-index:2;background:var(--parch);color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.5);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.5em;padding:1em;font-size:calc(var(--pw)*.042);border:1px solid var(--parch-dark)}
.exlib .small{font-family:var(--f-head);letter-spacing:.15em;font-size:.8em;color:var(--ink-soft)}
.exlib .name{font-family:var(--f-hand);font-size:2.2em;line-height:1;color:var(--ink-red)}
.exlib svg{width:3.2em}

/* Commandes */
.bar{display:flex;align-items:center;gap:14px;font-family:var(--f-head);color:var(--gold);font-size:15px;letter-spacing:.06em}
.bar button{font:inherit;background:transparent;color:var(--gold);border:1px solid var(--gold-soft);border-radius:999px;width:44px;height:44px;cursor:pointer;font-size:20px;line-height:1}
.bar button:hover:not(:disabled){background:rgba(201,162,90,.12)}
.bar button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.bar button:disabled{opacity:.3;cursor:default}
.count{min-width:9em;text-align:center}
.hint{font-family:var(--f-body);font-style:italic;color:var(--gold-soft);font-size:13px;text-align:center}

/* Pages de cartes, d'après le modèle de Cha */
:root{--ink-violet:#5b2462}
.entry{display:grid;grid-template-columns:37% 1fr;gap:calc(var(--pw)*.05);align-items:center;flex:1;min-height:0}
.entry.droite{grid-template-columns:1fr 37%}
.entry.droite img{order:2}
.entry img{width:100%;height:auto;display:block;filter:drop-shadow(0 3px 5px rgba(60,30,10,.45))}
.entry .txt{min-width:0;display:flex;flex-direction:column;gap:.4em;text-align:center}
.entry h3{margin:0;font-family:var(--f-hand);font-weight:normal;color:var(--ink-violet);font-size:1.45em;line-height:1.15;text-wrap:balance}
.entry p{font-size:1.02em;line-height:1.5}
.entry h3 .num{font-family:var(--f-head);font-size:.8em;letter-spacing:.04em}
.flourish{color:var(--ink-soft);display:flex;justify-content:center}
.flourish svg{width:80%;height:auto}
.cv .band{letter-spacing:.5em}

/* Couverture aux couleurs des cartes : nuit cosmique violette, magenta et or */
.cover{background:
  radial-gradient(ellipse at 22% 18%, rgba(214,92,170,.45), transparent 45%),
  radial-gradient(ellipse at 85% 80%, rgba(80,120,220,.4), transparent 50%),
  radial-gradient(ellipse at 60% 45%, rgba(150,70,200,.35), transparent 55%),
  linear-gradient(160deg,#2a1450,#140a2e 60%,#0d0820);
  color:#e7c983;box-shadow:inset 0 0 calc(var(--pw)*.12) rgba(5,0,20,.8)}
.cover::before{opacity:.9;mix-blend-mode:screen;background-size:240px 240px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><g fill='white'><circle cx='20' cy='30' r='.9' opacity='.8'/><circle cx='70' cy='12' r='.6' opacity='.6'/><circle cx='130' cy='50' r='1.1' opacity='.9'/><circle cx='200' cy='22' r='.7' opacity='.7'/><circle cx='45' cy='110' r='.6' opacity='.5'/><circle cx='160' cy='120' r='.9' opacity='.8'/><circle cx='220' cy='150' r='.6' opacity='.6'/><circle cx='95' cy='170' r='1' opacity='.8'/><circle cx='30' cy='200' r='.7' opacity='.6'/><circle cx='180' cy='210' r='.6' opacity='.7'/><circle cx='115' cy='90' r='.5' opacity='.5'/><circle cx='235' cy='80' r='.8' opacity='.7'/></g></svg>")}
.cover .cv{border-color:#c9a25a;outline-color:#8f6d35}
.cover .cv h1{color:#f0d592;text-shadow:0 0 12px rgba(240,200,120,.45),0 1px 0 #000}
.cover .cv .band,.cover .cv .by{color:#e7c983}
.spine-l{background:linear-gradient(90deg,rgba(5,0,20,.7),transparent)}
.spine-r{background:linear-gradient(270deg,rgba(5,0,20,.7),transparent)}
.endpaper{background:
  radial-gradient(ellipse at 30% 30%, rgba(214,92,170,.35), transparent 50%),
  radial-gradient(ellipse at 75% 75%, rgba(80,120,220,.35), transparent 55%),
  #1c0f3a}
.endpaper::after{background:radial-gradient(ellipse,transparent 35%,rgba(5,0,20,.6))}
.exlib{border-color:#c9a25a}
:root{--desk:#120b1f;--desk-glow:#3a2150;--gold:#e7c983;--gold-soft:#a3854e}

/* Tirages */
h4{margin:0;font-family:var(--f-hand);font-weight:normal;color:var(--ink-violet);font-size:1.4em;text-align:center}
.spread{display:grid;justify-content:center;gap:calc(var(--pw)*.03);margin:.3em 0}
.spread.one{grid-template-columns:28%}
.spread.three{grid-template-columns:repeat(3,25%)}
.spread.cross{grid-template-columns:repeat(3,25%);grid-template-areas:". t ." "l m r" ". b .";gap:calc(var(--pw)*.012) calc(var(--pw)*.03);flex:1;align-content:center}
.c-top{grid-area:t}.c-left{grid-area:l}.c-mid{grid-area:m}.c-right{grid-area:r}.c-bot{grid-area:b}
.slot{margin:0;display:flex;flex-direction:column;align-items:center;gap:.2em}
.bk{position:relative;width:100%}
.bk img{width:100%;height:auto;display:block;filter:drop-shadow(0 2px 4px rgba(60,30,10,.45))}
.spread.cross .bk{width:78%;margin:0 auto}
.badge{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:1.7em;height:1.7em;border-radius:50%;display:grid;place-items:center;
  background:var(--parch);color:var(--ink-violet);border:1.5px solid var(--ink-violet);font-family:var(--f-head);font-size:1em;box-shadow:0 1px 4px rgba(0,0,0,.5)}
figcaption{font-family:var(--f-hand);color:var(--ink);font-size:.95em;text-align:center;line-height:1.1;white-space:nowrap}
.pg b{font-weight:normal;color:var(--ink-violet)}

/* Cristallomancie : nuit bleu glacier, encre bleu canard, cristaux */
:root{--ink-teal:#1b4f6b;--crystal:#7fc4e3;--desk:#0b1220;--desk-glow:#1d3550;--gold:#d7e6f0;--gold-soft:#8aa5b8}
.cover{background:
  radial-gradient(circle at 50% 42%, rgba(140,210,240,.28), transparent 38%),
  radial-gradient(ellipse at 20% 15%, rgba(150,110,220,.3), transparent 50%),
  radial-gradient(ellipse at 85% 85%, rgba(60,130,190,.35), transparent 55%),
  linear-gradient(160deg,#1a2d4d,#0e1a33 60%,#081024);color:var(--gold);box-shadow:inset 0 0 calc(var(--pw)*.12) rgba(0,5,20,.8)}
.cover .cv{border-color:#a9c6d8;outline-color:#6d8ca1}
.cover .cv h1{color:#e6f2fa;font-size:calc(var(--pw)*.13);text-shadow:0 0 14px rgba(127,196,227,.6),0 1px 0 #000}
.cover .cv .band,.cover .cv .by{color:#cfe3ef}
.cover .cv svg{color:#bfe0f0;filter:drop-shadow(0 0 6px rgba(127,196,227,.6))}
.endpaper{background:radial-gradient(ellipse at 30% 30%, rgba(150,110,220,.3), transparent 50%),radial-gradient(ellipse at 75% 75%, rgba(60,150,200,.35), transparent 55%),#13213d}
.endpaper::after{background:radial-gradient(ellipse,transparent 35%,rgba(0,5,20,.6))}
.exlib{border-color:#a9c6d8}
h2{color:var(--ink-teal)}
.flourish{color:var(--ink)}
.entry{grid-template-columns:36% 1fr}
.entry.droite{grid-template-columns:1fr 36%}
.entry .txt{text-align:left}
.entry.droite .txt{text-align:right}
.entry h3{color:var(--ink-teal);font-size:1.5em}
.entry img{filter:drop-shadow(0 4px 6px rgba(40,30,60,.4))}
@media (prefers-reduced-motion:reduce){.leaf,.book{transition:none}}
</style>
</head>
<body>


<div class="wrap">
  <div class="stage" id="stage"><div class="book" id="book"></div></div>
  <div class="bar">
    <button id="prev" aria-label="Page précédente">‹</button>
    <span class="count" id="count">Couverture</span>
    <button id="next" aria-label="Page suivante">›</button>
  </div>
  <div class="hint">Clique sur une page, glisse du doigt ou utilise les flèches du clavier pour feuilleter.</div>
</div>

<template id="hecate">
<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true">
  <circle cx="50" cy="50" r="44"/><circle cx="50" cy="50" r="38" stroke-width="1"/>
  <circle cx="50" cy="44" r="18"/><path d="M41 37 Q46 31 53 31" stroke-width="1.6"/>
  <path d="M36 60 H64 L68 70 H32 Z"/>
  <path d="M50 14v5M50 80v5M78 30l-4 3M22 30l4 3" stroke-width="1.4"/>
</svg>
</template>
<template id="fl"><svg viewBox="0 0 300 40" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true">
<path d="M10 10 H120 M180 10 H290"/><path d="M120 10 C130 0,142 2,145 10 C140 18,130 18,120 10"/><path d="M180 10 C170 0,158 2,155 10 C160 18,170 18,180 10"/>
<path d="M150 10 V16" /><path d="M150 16 L156 25 L150 37 L144 25 Z" fill="var(--crystal)" stroke="var(--ink-teal)"/>
<path d="M60 10 V15"/><path d="M60 15 L63 21 L60 28 L57 21 Z" fill="var(--crystal)" stroke="var(--ink-teal)"/>
<path d="M240 10 V15"/><path d="M240 15 L243 21 L240 28 L237 21 Z" fill="var(--crystal)" stroke="var(--ink-teal)"/>

const H = document.getElementById('hecate').innerHTML;
const FL = document.getElementById('fl').innerHTML;
const row = (r,l,n)=>`<div class="row"><span class="r">${r}</span><span class="l">${l}</span><span class="n">${n}</span></div>`;
const page = (num, inner)=>`<div class="gutter"></div><div class="pg">${inner}</div>${num?`<div class="folio">${num}</div>`:''}`;

const ENT=[["Serpent", "Danger ou transformation à venir."], ["Oiseaux", "Symbole de nouvelles à venir ou de voyages."], ["Eau (Océan)", "Cela peut symboliser les émotions, les flux d'énergie émotionnelle, ou des événements à venir liés à la fluidité ou aux changements émotionnels."], ["Éclairs", "Un signe de changement soudain, souvent inattendu, pouvant être associé à des conflits ou des bouleversements."], ["Nuages sombres ou brume", "Signe de danger, de tristesse ou d'événements difficiles à venir."], ["Soleil", "La réussite, la clarté et les nouveaux commencements."], ["Lune", "La présence de la lune dans une vision peut indiquer des secrets, des cycles, ou des changements émotionnels."], ["Étoiles", "Symbolisent souvent l'espoir, la guidance spirituelle, ou une période d'opportunité à venir."], ["Cercle", "Représente l'infini, le renouveau ou la complétude. Cela peut indiquer que quelque chose va boucler la boucle."], ["Arbres ou nature", "Indique la croissance, la prospérité, ou un nouveau départ."], ["Clé", "Découverte d'un secret ou nouvelle opportunité."], ["Pont", "Un passage à travers une période difficile ou une décision à prendre."], ["Chaînes", "Un sentiment d'emprisonnement, de contrainte ou de responsabilité lourde."], ["Visage", "Voir un visage familier ou inconnu pourrait indiquer une rencontre avec quelqu'un d'important ou une relation qui va jouer un rôle dans l'avenir."], ["Rouge", "Passion, colère, danger imminent."], ["Bleu", "Calme, clarté, harmonie."], ["Vert", "Croissance, chance, prospérité."], ["Noir", "Mystère, ombre, souvent interprété comme un avertissement de quelque chose de sombre à venir."]];
const ROM=["i", "ii", "iii", "iv", "v", "vi", "vii", "viii", "ix", "x"];
const entry=(e,i)=>`<div class="entry ${i%2?'droite':'gauche'}"><img src="${IMG['boule-'+String(i+1).padStart(2,'0')+'.webp']}" alt="Boule de cristal : ${e[0]}"><div class="txt"><h3>${e[0]}</h3><p>${e[1]}</p></div></div>`;
const pages=[];
for(let p=0;p<ENT.length/2;p++){
  const a=ENT[2*p], b=ENT[2*p+1];
  pages.push({cls:'paper', html:page(ROM[p], (p===0?'<h2>Interprétation</h2><div class="flourish">'+FL+'</div>':'')+entry(a,2*p)+'<div class="flourish">'+FL+'</div>'+entry(b,2*p+1)), label:a[0]+' · '+b[0]});
}
const sides = [
 {cls:'cover', html:`<div class="spine-l"></div><div class="cv">
    <div class="band">✧ ◆ ✧</div>
    <h1>Cristallomancie</h1>
    ${H}
    <div class="by">Alice Hecalys</div>
    <div class="band">✧ ◆ ✧</div></div>`, label:'Couverture'},
 {cls:'endpaper', html:`<div class="exlib">
    <div class="small">Ce livre appartient à</div>
    <div class="name">Alice Hecalys</div>
    <div class="small">Skyborn de Skylis</div>
    <span style="color:var(--ink-teal)">${H}</span>
    <p>Qui le trouve le rende.<br>Qui le lit le respecte.</p></div>`, label:'Ex-libris'},
 ...pages,
 {cls:'endpaper', html:'', label:'Garde'},
 {cls:'cover', html:`<div class="spine-r"></div><div class="cv"><div class="band">✧ ◆ ✧</div>${H}<div class="band">✧ ◆ ✧</div></div>`, label:'Quatrième de couverture'}
];
if(sides.length%2) sides.splice(sides.length-2,0,{cls:'endpaper', html:'', label:'Garde'});

const book = document.getElementById('book'), stage = document.getElementById('stage');
const N = sides.length/2; const leaves=[];
for(let i=0;i<N;i++){
  const lf=document.createElement('div'); lf.className='leaf';
  const f=sides[2*i], b=sides[2*i+1];
  lf.innerHTML=`<div class="face front ${f.cls}">${f.html}</div><div class="face back ${b.cls}">${b.html}</div>`;
  lf.addEventListener('click',()=>{ (lf.classList.contains('flipped')?prev:next)(); });
  book.appendChild(lf); leaves.push(lf);
}

let single=false, s=0; // s = index de la face affichée en mode page seule
let f=0; // nombre de feuillets tournés
let timer=null;

function layout(){
  const vw=window.innerWidth, vh=window.innerHeight;
  single = vw<760;
  const availH = vh-130;
  let pw = single ? Math.min(vw-32, availH*0.7) : Math.min((vw-48)/2, availH*0.7);
  pw = Math.max(200, Math.floor(pw));
  document.documentElement.style.setProperty('--pw', pw+'px');
  document.documentElement.style.setProperty('--ph', Math.round(pw/0.7)+'px');
  stage.classList.toggle('single', single);
  stage.style.width = (single? pw : pw*2)+'px';
  stage.style.height = Math.round(pw/0.7)+'px';
  if(single){ f=Math.ceil(s/2); } else { s = f===0?0:Math.min(2*f, sides.length-1); }
  render(false);
}
function render(animate=true){
  const pw=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--pw'));
  leaves.forEach((lf,i)=>{
    const flipped=i<f;
    if(flipped!==lf.classList.contains('flipped')){
      lf.style.zIndex = 100;
      clearTimeout(lf._t); lf._t=setTimeout(()=>{lf.style.zIndex = lf.classList.contains('flipped')? i+1 : N-i;}, animate?900:0);
    } else lf.style.zIndex = flipped? i+1 : N-i;
    lf.classList.toggle('flipped',flipped);
  });
  let x=0;
  if(single){ x = (s%2===0) ? -pw : 0; }
  else { if(f===0) x=-pw/2; else if(f===N) x=pw/2; }
  book.style.transform=`translateX(${x}px)`;
  const label = single ? sides[s].label : (f===0? 'Couverture' : f===N ? 'Quatrième de couverture' : `${sides[2*f-1].label}  ·  ${sides[2*f].label}`);
  document.getElementById('count').textContent=label;
  document.getElementById('prev').disabled = single ? s===0 : f===0;
  document.getElementById('next').disabled = single ? s===sides.length-1 : f===N;
}
function next(){ if(single){ if(s<sides.length-1){s++; f=Math.ceil(s/2);} } else if(f<N) f++; render(); }
function prev(){ if(single){ if(s>0){s--; f=Math.ceil(s/2);} } else if(f>0) f--; render(); }
document.getElementById('next').onclick=next;
document.getElementById('prev').onclick=prev;
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight')next(); if(e.key==='ArrowLeft')prev(); });
let tx=null;
stage.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
stage.addEventListener('touchend',e=>{ if(tx===null)return; const d=e.changedTouches[0].clientX-tx; if(Math.abs(d)>40){ d<0?next():prev(); e.preventDefault(); } tx=null; });
window.addEventListener('resize',layout);
layout();
</script>
